[project]
name = "06-cml"
version = "0.1.0"
description = ""
authors = [
    {name = "Michele Lombardi",email = "michele.lombardi2@unibo.it"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "notebook (>=7.6.5,<8.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "tensorflow (>=2.21.0,<3.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "igraph (>=1.0.0,<2.0.0)",
    "ortools (==9.14.6206)",
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab-rise (>=0.43.1,<0.44.0)",
    "nbconvert[webpdf] (>=7.17.2,<8.0.0)"
]
